services:
  # Backend API
  - type: web
    name: legalkonect-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    envVars:
      - key: APP_NAME
        value: LegalKonect
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_URL
        sync: false
      - key: APP_KEY
        generateValue: true
      - key: DB_CONNECTION
        value: mysql
      - key: DB_HOST
        fromDatabase:
          name: legalkonect-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: legalkonect-db
          property: port
      - key: DB_DATABASE
        fromDatabase:
          name: legalkonect-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: legalkonect-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: legalkonect-db
          property: password

databases:
  - name: legalkonect-db
    databaseName: legalkonect
    user: legalkonect
