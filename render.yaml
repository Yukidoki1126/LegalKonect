services:
  # Backend API
  - type: web
    name: legalkonect-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    envVars:
      - key: APP_NAME
        value: LegalKonect
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_URL
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: APP_KEY
        generateValue: true
      - key: DB_CONNECTION
        value: mysql
      - key: DB_HOST
        fromDatabase:
          name: legalkonect-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: legalkonect-db
          property: port
      - key: DB_DATABASE
        fromDatabase:
          name: legalkonect-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: legalkonect-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: legalkonect-db
          property: password
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: SANCTUM_STATEFUL_DOMAINS
        sync: false
      - key: SESSION_DRIVER
        value: database
      - key: SESSION_LIFETIME
        value: 120
      - key: SESSION_ENCRYPT
        value: false
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: database
      - key: MAIL_MAILER
        value: resend
      - key: RESEND_KEY
        sync: false
      - key: MAIL_FROM_ADDRESS
        value: noreply@legalkonect.com
      - key: MAIL_FROM_NAME
        value: LegalKonect
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_ID
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_SECRET
        sync: false
      - key: FILESYSTEM_DISK
        value: local
      - key: LOG_CHANNEL
        value: stack
      - key: LOG_LEVEL
        value: info

  # Frontend (React)
  - type: web
    name: legalkonect-frontend
    runtime: static
    buildCommand: cd ../frontend && npm install && npm run build
    staticPublishPath: ../frontend/build
    envVars:
      - key: REACT_APP_API_URL
        sync: false
      - key: REACT_APP_STORAGE_URL
        sync: false
      - key: REACT_APP_GOOGLE_MAPS_API_KEY
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: legalkonect-db
    databaseName: legalkonect
    user: legalkonect
